name: Android Java source check
on:
  push:
    branches: [main]
    paths:
      - 'tools/native/android/**'
      - 'tools/native/prepare_android_app.py'
      - '.github/workflows/android-java-check.yml'
  pull_request:
    paths:
      - 'tools/native/android/**'
      - 'tools/native/prepare_android_app.py'
      - '.github/workflows/android-java-check.yml'
permissions:
  contents: read
jobs:
  compile-android-java:
    name: Compile generated Android Java sources
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: coccofresco/TriAevum
          ref: 17218b0cfdb944645bb5cde5249f313dca7e53ce
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: libsdl-org/SDL
          ref: 5d249570393f7a37e037abf22cd6012a4cc56a71
          path: sdl
          sparse-checkout: android-project/app/src/main/java
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Generate Android app sources
        run: python tools/native/prepare_android_app.py engine
      - name: Compile Android Java sources
        run: |
          gradle -p engine/ports/android :app:compileReleaseJavaWithJavac \
            -PtriaevumSdlSource="$GITHUB_WORKSPACE/sdl"
