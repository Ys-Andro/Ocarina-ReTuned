name: Android Java source check
on:
  push:
    branches: [main]
    paths:
      - 'tools/native/android/**'
      - 'tools/native/prepare_android_app.py'
      - '.github/workflows/android-java-check.yml'
  pull_request:
    paths:
      - 'tools/native/android/**'
      - 'tools/native/prepare_android_app.py'
      - '.github/workflows/android-java-check.yml'
permissions:
  contents: read
jobs:
  compile-android-java:
    name: Compile generated Android Java sources
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: coccofresco/TriAevum
          ref: 17218b0cfdb944645bb5cde5249f313dca7e53ce
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: libsdl-org/SDL
          ref: 5d249570393f7a37e037abf22cd6012a4cc56a71
          path: sdl
          sparse-checkout: android-project/app/src/main/java
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Apply Android source adapters
        run: |
          python tools/native/apply_android_port.py engine
          python tools/reframed/apply_native_port.py engine
          python tools/reframed/apply_renderer_port.py engine
          python tools/native/apply_audio_port.py engine
          python tools/frontend/apply_frontend_port.py engine
          python tools/native/prepare_android_app.py engine
          python tools/native/android/apply_dual_screen_probe.py engine
          PYTHONPATH=tools/native:tools/reframed:tools/frontend python -c 'from pathlib import Path; from apply_mobile_frontend import apply; apply(Path("engine"))'
      - name: Prepare compile-only native stage
        run: |
          mkdir -p stage/arm64-v8a
          for name in SDL2 TriAevum triaevum_title_bootstrap triaevum_title_aot c++_shared; do
            touch "stage/arm64-v8a/lib${name}.so"
          done
      - name: Compile Android Java sources
        run: |
          gradle -p engine/ports/android :app:compileReleaseJavaWithJavac \
            -PtriaevumSdlSource="$GITHUB_WORKSPACE/sdl" \
            -PtriaevumNativeStage="$GITHUB_WORKSPACE/stage"
