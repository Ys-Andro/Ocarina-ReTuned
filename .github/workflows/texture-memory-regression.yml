name: Texture memory regression
on:
  push:
    branches: [main]
    paths:
      - 'tools/frontend/texture_memory.h'
      - 'tools/frontend/texture_memory_platform.h'
      - 'tools/frontend/texture_memory_loader.cpp.inc'
      - 'tests/texture_memory.cpp'
      - '.github/workflows/texture-memory-regression.yml'
  pull_request:
    paths:
      - 'tools/frontend/texture_memory.h'
      - 'tools/frontend/texture_memory_platform.h'
      - 'tools/frontend/texture_memory_loader.cpp.inc'
      - 'tests/texture_memory.cpp'
      - '.github/workflows/texture-memory-regression.yml'
permissions:
  contents: read
jobs:
  texture-memory:
    name: Texture cache budget regression (C++20)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Compile regression test
        run: c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic tests/texture_memory.cpp -o texture-memory-test
      - name: Run regression test
        run: ./texture-memory-test
      - name: Compile with address and undefined-behavior sanitizers
        run: c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/texture_memory.cpp -o texture-memory-sanitized
      - name: Run sanitized regression test
        run: ./texture-memory-sanitized
